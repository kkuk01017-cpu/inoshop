<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ — iNO Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0F0F1A',
                        card: '#1A1A2E',
                        primary: '#4F9FFF',
                        secondary: '#00D9FF',
                        success: '#22C55E',
                        danger: '#EF4444',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-white min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">iNO Shop</h1>
            <p class="text-gray-400 mt-2">เข้าสู่ระบบแอดมิน</p>
        </div>

        <div class="bg-card rounded-2xl p-8 border border-gray-700 shadow-2xl">
            <div id="loginForm">
                <div class="mb-5">
                    <label class="block text-sm text-gray-400 mb-2">ชื่อผู้ใช้</label>
                    <input type="text" id="username" class="w-full bg-dark border border-gray-600 rounded-lg px-4 py-3 focus:border-primary focus:outline-none" placeholder="กรอกชื่อผู้ใช้">
                </div>
                <div class="mb-6">
                    <label class="block text-sm text-gray-400 mb-2">รหัสผ่าน</label>
                    <input type="password" id="password" class="w-full bg-dark border border-gray-600 rounded-lg px-4 py-3 focus:border-primary focus:outline-none" placeholder="กรอกรหัสผ่าน">
                </div>
                <div id="errorMsg" class="text-danger text-sm mb-4 hidden">
                    <i class="fa fa-exclamation-circle mr-1"></i> ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง
                </div>
                <button onclick="doLogin()" class="w-full bg-gradient-to-r from-primary to-secondary py-3 rounded-lg font-semibold text-dark hover:opacity-90 transition-opacity">
                    <i class="fa fa-sign-in mr-2"></i> เข้าสู่ระบบ
                </button>
                <a href="index.html" class="block text-center text-gray-400 text-sm mt-4 hover:text-secondary">
                    <i class="fa fa-arrow-left mr-1"></i> กลับไปหน้าร้านค้า
                </a>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if (isLoggedIn()) {
            window.location.href = 'admin.html';
        }

        function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (login(username, password)) {
                window.location.href = 'admin.html';
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        document.getElementById('password').addEventListener('keypress', e => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
